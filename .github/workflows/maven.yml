name: Java Maven CI

on:
  push:
    branches:
      - RemoteBranch

  pull_request:
    branches:
      - RemoteBranch

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare project path used by test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\Maven Project' | Out-Null
          Copy-Item -Path '${{ github.workspace }}' -Destination 'D:\Maven Project\demo' -Recurse -Force

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: D:\Maven Project\demo
        run: mvn --batch-mode clean test

      - name: Package application
        working-directory: D:\Maven Project\demo
        run: mvn --batch-mode package -DskipTests